name: Release

# Cuts a public release of the desktop app (macOS + Windows).
#
# Trigger:  push a tag matching v*.*.* (e.g. `git tag v0.1.0 && git push --tags`)
# Output:   a GitHub Release with macOS DMGs (Apple Silicon + Intel),
#           a Windows MSI/NSIS installer, updater archives + signatures,
#           and a single `latest.json` consumed by the in-app updater.
#
# The first build job to run creates the GitHub Release. Subsequent jobs
# upload their artifacts to the same release. The `finalize` job builds
# latest.json once all builds complete. The `rebuild-landing` job always
# runs — even on partial failure — to update the download page.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS (both architectures, sequential on one runner) ──
  build-macos:
    permissions:
      contents: write
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-universal-
      - run: npm ci
      - name: Build aarch64 (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenIT ${{ github.ref_name }}"
          releaseBody: |
            See the [full changelog](https://github.com/openit-app/openit-app/releases/tag/${{ github.ref_name }}) for details.

            **macOS first launch:** macOS may say "OpenIT can't be opened because Apple cannot check it for malicious software." Open System Settings → Privacy & Security, scroll down, and click "Open Anyway."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin
      - name: Build x64 (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenIT ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-apple-darwin

  # ── Windows (x64) ──
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm ci
      - name: Build Windows x64
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenIT ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
      # Tauri 2's NSIS bundler produces `*.exe` + `*.exe.sig` (not the
      # older v1 `.nsis.zip` format). tauri-action uploads both, so no
      # extra upload step is needed here — the in-app updater downloads
      # the `.exe` directly and verifies it against the sig embedded in
      # latest.json. createUpdaterArtifacts is still required in
      # tauri.conf.json to make the bundler emit the `.exe.sig`.

  # ── Build latest.json after all builds complete ──
  finalize:
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # macOS: updater archive is `.app.tar.gz` (tar of the bundled .app).
          # Windows: updater downloads the NSIS installer `.exe` directly —
          # Tauri 2 dropped the v1 `.nsis.zip` wrapper. The pre-existing
          # `.exe.sig` produced by the bundler is the authoritative signature,
          # but the latest.json schema embeds the signature inline, so we
          # re-sign here (deterministic against the same private key).
          # -fsSL fails immediately on HTTP errors so we never sign a 404 page.
          curl -fsSL "${BASE}/OpenIT_aarch64.app.tar.gz"            -o /tmp/aarch64.tar.gz
          curl -fsSL "${BASE}/OpenIT_x64.app.tar.gz"                -o /tmp/x64.tar.gz
          curl -fsSL "${BASE}/OpenIT_${VERSION}_x64-setup.exe"      -o /tmp/win64-setup.exe

          AARCH64_SIG=$(npx tauri signer sign /tmp/aarch64.tar.gz   2>&1 | grep -A1 "Public signature:" | tail -1)
          X64_SIG=$(npx tauri signer sign /tmp/x64.tar.gz           2>&1 | grep -A1 "Public signature:" | tail -1)
          WIN64_SIG=$(npx tauri signer sign /tmp/win64-setup.exe    2>&1 | grep -A1 "Public signature:" | tail -1)

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${TAG} for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "${BASE}/OpenIT_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${X64_SIG}",
                "url": "${BASE}/OpenIT_x64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WIN64_SIG}",
                "url": "${BASE}/OpenIT_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          python3 -m json.tool /tmp/latest.json > /dev/null
          gh release upload "${TAG}" /tmp/latest.json --clobber

      # Belt-and-suspenders: HEAD every URL in the freshly-uploaded
      # latest.json. Catches future regressions where a workflow change
      # silently drops an artifact or renames it under our feet.
      - name: Verify latest.json URLs resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          urls=$(python3 -c "import json; d=json.load(open('/tmp/latest.json')); [print(p['url']) for p in d['platforms'].values()]")
          fail=0
          while IFS= read -r u; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" -I "$u")
            if [ "$code" != "200" ]; then
              echo "::error::latest.json url returned HTTP $code: $u"
              fail=1
            else
              echo "ok $u"
            fi
          done <<< "$urls"
          [ "$fail" -eq 0 ] || exit 1

  # ── Always rebuild landing — no dependencies on build success ──
  rebuild-landing:
    if: always()
    needs: [build-macos, build-windows]
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release to settle
        run: sleep 15
      - name: Trigger landing page rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run landing.yml --repo ${{ github.repository }} || true
