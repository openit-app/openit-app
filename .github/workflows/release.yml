name: Release

# Cuts a public release of the macOS desktop app.
#
# Trigger:  push a tag matching v*.*.* (e.g. `git tag v0.1.0 && git push --tags`)
# Output:   a GitHub Release with two DMGs (Apple Silicon + Intel), the matching
#           updater archives + signatures, and a single `latest.json` consumed by
#           the in-app updater.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-universal-

      - run: npm ci

      # Build Apple Silicon
      - name: Build aarch64 (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenIT ${{ github.ref_name }}"
          releaseBody: |
            See the [full changelog](https://github.com/openit-app/openit-app/releases/tag/${{ github.ref_name }}) for details.

            **First-time install:** macOS will say *"OpenIT can't be opened
            because Apple cannot check it for malicious software."* Open
            System Settings → Privacy & Security, scroll down, and click
            "Open Anyway."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin

      # Build Intel
      - name: Build x64 (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenIT ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-apple-darwin

      # tauri-action's includeUpdaterJson is broken (can't find its own .sig
      # files). We build latest.json ourselves: download the archives from the
      # release, sign them with `tauri signer`, and upload.
      - name: Build and upload latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # Download the updater archives we just uploaded
          curl -sL "${BASE}/OpenIT_aarch64.app.tar.gz" -o /tmp/aarch64.tar.gz
          curl -sL "${BASE}/OpenIT_x64.app.tar.gz" -o /tmp/x64.tar.gz

          # Sign with tauri signer (produces base64 signature strings)
          AARCH64_SIG=$(npx tauri signer sign /tmp/aarch64.tar.gz 2>&1 | grep -A1 "Public signature:" | tail -1)
          X64_SIG=$(npx tauri signer sign /tmp/x64.tar.gz 2>&1 | grep -A1 "Public signature:" | tail -1)

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${TAG} for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "${BASE}/OpenIT_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${X64_SIG}",
                "url": "${BASE}/OpenIT_x64.app.tar.gz"
              }
            }
          }
          EOF

          # Validate JSON
          python3 -m json.tool /tmp/latest.json > /dev/null

          # Upload to release
          gh release upload "${TAG}" /tmp/latest.json --clobber

      # tauri-action creates releases with GITHUB_TOKEN, which doesn't trigger
      # other workflows (release:published). Explicitly rebuild the landing page.
      - name: Rebuild landing page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run landing.yml
