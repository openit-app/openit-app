name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: CI only needs to read the checkout. Per-job overrides
# elsewhere can grant more if needed.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --component rustfmt --component clippy --profile minimal --no-self-update
          rustup default stable
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
        working-directory: .
      # Invoke cargo through `rustup run` to bypass PATH entirely.
      # The macos-latest image ships a system `cargo` that's actually
      # a rustup-init shim, which wins PATH ordering on the new image
      # and dies with "unexpected argument 'fmt'". `rustup run stable
      # cargo X` always picks the correct toolchain's binary.
      - run: rustup run stable cargo fmt -- --check
      - run: rustup run stable cargo clippy -- -D warnings
      - run: rustup run stable cargo test

  # Windows parity. The app ships a Windows build at release time
  # (release.yml -> build-windows), but until now nothing compiled or
  # tested for Windows on every PR, so cross-platform regressions only
  # surfaced at release. These jobs catch Windows breakage on each PR.
  frontend-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --component rustfmt --component clippy --profile minimal --no-self-update
          rustup default stable
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
        working-directory: .
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
